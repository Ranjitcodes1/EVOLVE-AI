<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="auto" style="font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow-road" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow-road" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="820" height="180" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a" letter-spacing="0.5">FIGURE 7.1: THREE-PHASE ARCHITECTURAL ROADMAP</text>

  <!-- Phase 1: Current -->
  <g transform="translate(30, 42)" filter="url(#shadow-road)">
    <rect width="220" height="110" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="220" height="26" rx="6" fill="#e0f2fe"/>
    <text x="110" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">CURRENT PRODUCTION</text>
    <text x="110" y="46" text-anchor="middle" font-size="8.5" fill="#1e293b">• YuNet Edge Detection + ArcFace 512-d</text>
    <text x="110" y="63" text-anchor="middle" font-size="8.5" fill="#1e293b">• Multi-Angle Wide Classroom Snapping</text>
    <text x="110" y="80" text-anchor="middle" font-size="8.5" fill="#1e293b">• Human-in-the-Loop Review &amp; Audit Log</text>
    <text x="110" y="97" text-anchor="middle" font-size="8.5" fill="#1e293b">• 3D Lanyard Passports &amp; 30-Day Purge</text>
  </g>

  <!-- Arrow P1 -> P2 -->
  <line x1="250" y1="97" x2="290" y2="97" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-road)"/>

  <!-- Phase 2: Near-Term -->
  <g transform="translate(290, 42)" filter="url(#shadow-road)">
    <rect width="230" height="110" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect width="230" height="26" rx="6" fill="#e0e7ff"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">PHASE 2: NEAR-TERM ROADMAP</text>
    <text x="115" y="46" text-anchor="middle" font-size="8.5" fill="#1e293b">• Anti-Spoofing &amp; Liveness (MiniFASNet)</text>
    <text x="115" y="63" text-anchor="middle" font-size="8.5" fill="#1e293b">• Distributed Celery + Redis Worker Cluster</text>
    <text x="115" y="80" text-anchor="middle" font-size="8.5" fill="#1e293b">• LMS Webhook Sync (Moodle / Canvas LTI 1.3)</text>
    <text x="115" y="97" text-anchor="middle" font-size="8.5" fill="#1e293b">• Multi-Campus Academic Multi-Tenancy</text>
  </g>

  <!-- Arrow P2 -> P3 -->
  <line x1="520" y1="97" x2="560" y2="97" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-road)"/>

  <!-- Phase 3: Long-Term -->
  <g transform="translate(560, 42)" filter="url(#shadow-road)">
    <rect width="230" height="110" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect width="230" height="26" rx="6" fill="#d1fae5"/>
    <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">PHASE 3: LONG-TERM VISION</text>
    <text x="115" y="46" text-anchor="middle" font-size="8.5" fill="#1e293b">• Continuous RTSP CCTV Classroom Tracking</text>
    <text x="115" y="63" text-anchor="middle" font-size="8.5" fill="#1e293b">• ByteTrack Dwell-Time Attendance Voting</text>
    <text x="115" y="80" text-anchor="middle" font-size="8.5" fill="#1e293b">• Multi-Camera Spatio-Temporal Fusion</text>
    <text x="115" y="97" text-anchor="middle" font-size="8.5" fill="#1e293b">• Automated WhatsApp &amp; SMS Parent Alerts</text>
  </g>
</svg>